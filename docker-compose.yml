services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: task
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s

  backend:
    build: ./task-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/task
      DB_USER: root
      DB_PASSWORD: root
      CORS_URL: http://localhost:4200
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./task-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql-data: