spring:
  application:
    name: task-backend
  datasource:
    url: jdbc:mysql://localhost:3306/task
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
  show-sql: true
  liquibase:
    contexts: dev
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

logging:
  level:
    liquibase: DEBUG
